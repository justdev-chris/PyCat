name: Build PyCat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
    
    - name: Build with .spec
      run: |
        echo "=== Building PyCat ==="
        echo "Current directory:"
        Get-Location
        echo ""
        echo "Files in current directory:"
        Get-ChildItem
        echo ""
        echo "Spec file check:"
        Select-String -Path pycat.spec -Pattern "name="
        echo ""
        
        # Build
        pyinstaller pycat.spec
        
        echo ""
        echo "=== After build ==="
        echo "dist folder contents:"
        if (Test-Path "dist") {
            Get-ChildItem "dist"
        } else {
            echo "dist folder doesn't exist"
        }
        
        echo ""
        echo "Searching for .exe files:"
        Get-ChildItem -Recurse -Filter *.exe -ErrorAction SilentlyContinue | Format-Table Name, Directory
    
    - name: Upload executable 
      uses: actions/upload-artifact@v4
      with:
        name: pycat-build
        path: dist/*.exe
        if-no-files-found: error
