name: Build PyCat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
    
    - name: Build with .spec
      run: |
        echo "=== Building PyCat ==="
        echo "Current directory:"
        pwd
        echo ""
        echo "Files in current directory:"
        ls -la
        echo ""
        echo "Spec file contents:"
        cat pycat.spec | grep -A5 -B5 "name="
        echo ""
        
        # Build
        pyinstaller pycat.spec
        
        echo ""
        echo "=== After build ==="
        echo "dist folder contents:"
        ls -la dist/ || echo "dist folder doesn't exist"
        echo ""
        echo "All .exe files:"
        find . -name "*.exe" -type f 2>/dev/null || echo "No .exe files found"
    
    - name: Upload ANY executable found
      uses: actions/upload-artifact@v4
      with:
        name: pycat-build
        path: |
          dist/*.exe
          dist/*.app
          *.exe
          build/*.exe
        if-no-files-found: error
