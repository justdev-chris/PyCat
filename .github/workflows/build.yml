name: Build PyCat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
    
    - name: Build executable
      run: |
        # Build
        pyinstaller --onefile --name pycat pycat.spec
        
        # Verify file exists
        dir dist\
        echo "File size:" (Get-Item "dist\pycat.exe").Length "bytes"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pycat-windows
        path: dist/pycat.exe
        if-no-files-found: error  # This will fail if file doesn't exist
